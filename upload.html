<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload H5 Game | PlayOrbit</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><style>main{max-width:680px;margin:0 auto;padding:84px 24px}.upload-form{margin-top:28px;padding:28px;background:#0c1728;border:1px solid #31435d;border-radius:8px}.upload-form label{display:grid;gap:8px;margin:17px 0;font-size:13px;font-weight:700}.upload-form input{background:#08111f;border:1px solid #344966;border-radius:5px;color:#eef6ff;padding:12px}.hint{font-size:12px;line-height:1.6;color:#91a3b9}.status{display:none;margin-top:18px;padding:12px;border-left:3px solid #c9ff5f;background:#13243a}.status.show{display:block}.status.error{border-color:#ff795a}</style></head><body><main><a class="brand" href="/"><span class="brand-mark">P</span><span>playorbit</span></a><p class="eyebrow" style="margin-top:60px"><span></span><span>GAME DEPLOYMENT</span></p><h1 style="font-size:48px">上传 H5 游戏</h1><p class="hero-text">上传 ZIP 后，系统会验证根目录的 <code>index.html</code>，解压并生成可直接运行的游戏地址。</p><form class="upload-form" id="uploadForm"><label>游戏名称<input name="name" required maxlength="80" placeholder="例如 Stellar Drift"></label><label>URL 标识<input name="slug" required pattern="[a-z0-9-]+" placeholder="例如 stellar-drift"><small class="hint">仅小写英文、数字和连字符。发布地址：/games/stellar-drift/</small></label><label>H5 游戏 ZIP<input name="archive" required type="file" accept=".zip,application/zip"></label><label>上传令牌<input name="token" required type="password" autocomplete="off" placeholder="Netlify 环境变量中的 UPLOAD_TOKEN"></label><p class="hint">ZIP 根目录必须直接包含 index.html。压缩包最大 60MB，暂不支持服务器端代码。</p><button class="button primary" type="submit">上传并发布</button><div id="status" class="status" role="status"></div></form></main><script>const form=document.querySelector('#uploadForm'),status=document.querySelector('#status');form.onsubmit=async(e)=>{e.preventDefault();status.className='status show';status.textContent='正在上传、校验并解压游戏包...';const data=new FormData(form),token=data.get('token');data.delete('token');try{const r=await fetch('/.netlify/functions/upload-game',{method:'POST',headers:{Authorization:'Bearer '+token},body:data}),j=await r.json();if(!r.ok)throw Error(j.error||'上传失败');status.innerHTML='发布成功：<a href="'+j.url+'" target="_blank">'+location.origin+j.url+'</a>';}catch(err){status.className='status show error';status.textContent=err.message;}};</script></body></html>
