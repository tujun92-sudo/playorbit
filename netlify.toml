[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/games/:slug/*"
  to = "/.netlify/functions/serve-game?slug=:slug&path=:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
